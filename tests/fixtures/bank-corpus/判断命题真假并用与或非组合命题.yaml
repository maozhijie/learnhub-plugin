  - kind: single_choice
    q: 在逻辑学中，设命题 P：“周六下雨”，Q：“周日下雨”。若已知 P 为真、Q 也为真，那么复合命题“P 或 Q”（即 $P \lor Q$）的真值是什么？
    options:
      - 真，因为逻辑中的“或”只要求至少一个命题为真
      - 假，因为“或”表示必须在两者中选一个
      - 真，因为“或”和“且”在这里意思相同
      - 无法确定，因为还要知道 $\lnot P$ 和 $\lnot Q$
    answer: A
    explanation: 逻辑中的“或”是兼或，$P \lor Q$ 在 P、Q 至少一个为真时为真；现在 P 和 Q 都为真，自然满足“至少一个为真”，所以结果为真。B 错在把日常“二选一”的排他或强加给逻辑或；C
      错在“或”与“且”并非意思相同，只是本题中两者恰好都为真；D 错在 P、Q 已知为真时，$P \lor Q$ 的真值已经被唯一确定为真，不需要再考虑否定。
    difficulty: 1
    section: s2
    uses:
      - 命题
      - 真值
      - 逻辑联结词
