  - kind: multi_choice
    q: 已知命题 $p$ 为真，$q$ 为假，则下列复合命题中为真的有（ ）
    options:
      - $\lnot p \lor q$
      - $p \land \lnot q$
      - $\lnot(p \land q)$
      - $p \lor q$
    answer:
      - B
      - C
      - D
    explanation: 先算否定与括号：$\lnot p$ 为假，$\lnot q$ 为真。A：假∨假=假；B：真∧真=真；C：$\lnot(真∧假)=\lnot 假=真$；D：真∨假=真。故 B、C、D 为真。
    difficulty: 2
    section: 通用
    uses:
      - 与或非联结词
      - 联结词的优先级
