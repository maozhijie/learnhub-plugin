  - kind: single_choice
    q: 下列句子中，属于命题的是（ ）
    options:
      - 今天真热啊！
      - 请把门关上。
      - 火星上有生命。
      - 明天会下雨吗？
    answer: C
    explanation: 命题是能判定真假的陈述句。感叹句“今天真热啊！”、祈使句“请把门关上。”、疑问句“明天会下雨吗？”都不能判断真假，因此不是命题；火星上有生命虽目前真假未知，但客观上非真即假，因此是命题。
    difficulty: 1
    section: 通用
    uses:
      - 命题的判定标准
      - 真假未知不等于不是命题
