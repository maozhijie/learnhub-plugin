node: 判断命题真假并用与或非组合命题
questions:
  - kind: single_choice
    q: 下列哪句话是命题？
    options:
      - 今天天气真好！
      - 火星上有生命吗？
      - 火星上有生命。
      - 请打开窗户。
    answer: C
    explanation: 命题是“能判定真假的陈述句”。C 是陈述句，虽然目前没人知道火星上是否有生命，但它的真假客观存在且唯一，所以仍是命题。A 是感叹句，B 是疑问句，D 是祈使句，它们都不是能判定真假的陈述句，因此都不是命题。
    difficulty: 1
