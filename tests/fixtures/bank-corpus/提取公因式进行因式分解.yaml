node: 提取公因式进行因式分解
questions:
  - kind: single_choice
    q: 演示中把 ax + ay 改写成 a(x + y)，这个变形属于什么？
    options:
      - 展开括号，把乘积的形式化成和的形式
      - 提取公因式，把和的形式改写成乘积的形式
      - 合并同类项，把多项式化简
      - 去分母，使等式更简洁
    answer: B
    explanation: 演示倒着用分配律，把公共因子 a 从每一项中“提”到括号外，使 ax + ay 从“和的形式”变成 a(x + y) 的“乘积的形式”，这是因式分解的雏形。选项 A 方向相反，是展开；选项 C、D 与这里的恒等变形不是同一回事。
    difficulty: 1
