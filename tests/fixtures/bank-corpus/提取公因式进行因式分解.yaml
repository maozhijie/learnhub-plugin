      - $3x$
      - $3x^2$
    answer: C
    explanation: 系数 $3$ 与 $6$ 的最大公因数为 $3$；两项都含有的字母只有 $x$，取最低次幂 $x^1$，所以公因式为 $3x$。$y$ 不在第一项中，$x^2$ 也不是第二项 $6xy$ 的因子。
    difficulty: 1
