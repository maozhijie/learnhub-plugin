  - kind: fill_in_blank
    q: 把 $-8a^3b^2+12a^2b^3-4a^2b$ 分解因式：____
    answer:
      - -4a^2b(2ab-3b^2+1)
      - -4a^2b(2ab - 3b^2 + 1)
      - -4a²b(2ab - 3b² + 1)
      - 4a^2b(-2ab+3b^2-1)
      - 4a²b(-2ab+3b²-1)
    explanation: 系数 8、12、4 的最大公因数为 4；字母 a、b 的最低次幂分别为 $a^2$、$b$，所以最大公因式为 $4a^2b$。原式首项为负，提出 $-4a^2b$：$-8a^3b^2 ÷
      (-4a^2b)=2ab$，$12a^2b^3 ÷ (-4a^2b)=-3b^2$，$-4a^2b ÷ (-4a^2b)=1$。注意最后一项提取后剩 1，不能省略，结果为 $-4a^2b(2ab-3b^2+1)$。
    difficulty: 2
    section: 通用
    uses:
      - 最大公因数
      - 符号处理
    id: q10
