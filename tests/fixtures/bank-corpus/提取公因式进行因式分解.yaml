  - kind: single_choice
    q: 小华将 $\frac{2}{3}x^2y-\frac{4}{9}xy^2$ 分解为 $xy(\frac{2}{3}x-\frac{4}{9}y)$。下列判断正确的是：
    options:
      - 小华正确，因为已经写成“公因式乘括号”的形式，完成提取公因式
      - 小华正确，因为展开 $xy(\frac{2}{3}x-\frac{4}{9}y)$ 后与原式相等
      - 小华不正确，因为 $\frac{2}{3}$ 和 $\frac{4}{9}$ 是分数，不能作为公因式的一部分
      - 小华提得不干净，还应提取系数部分的公因式 $\frac{2}{9}$，得 $\frac{2}{9}xy(3x-2y)$
    answer: D
    explanation: 先看字母：两项都含 $x$、$y$，$xy$ 是字母部分的公因式。但系数也应先提取最大公因数：$\frac{2}{3}=\frac{6}{9}$，$-\frac{4}{9}=-\frac{4}{9}$，分子 $6$
      和 $4$ 的最大公因数是 $2$，所以系数部分还有公因数 $\frac{2}{9}$。因此最大公因式是 $\frac{2}{9}xy$，完整结果是 $\frac{2}{9}xy(3x-2y)$。小华只提出
      $xy$，属于提不干净；分数系数同样可以提取公因式。
    difficulty: 2
    section: s2
    uses:
      - 分配律
      - 最大公因数
