  - kind: fill_in_blank
    q: 提取系数公因数和最低次幂，对 $2(x-y)^3+8(x-y)^2$ 因式分解：$2(x-y)^3+8(x-y)^2 =$ ______
    answer:
      - 2(x-y)^2(x-y+4)
      - 2(x-y)^2[(x-y)+4]
    explanation: 系数公因数为 2，$(x-y)$ 的最低次幂为 $(x-y)^2$，所以公因式是 $2(x-y)^2$。$2(x-y)^3 \div 2(x-y)^2 = x-y$，$8(x-y)^2 \div 2(x-y)^2
      = 4$，剩余部分相加得 $x-y+4$，因此原式 $=2(x-y)^2(x-y+4)$。注意提取的是 $(x-y)^2$，不是 $(x-y)^3$，且剩余部分中 $(x-y)$ 不能丢。
    difficulty: 2
    section: s4
    uses:
      - 整体提取公因式
      - 最低次幂
    id: q8
    fsrs:
