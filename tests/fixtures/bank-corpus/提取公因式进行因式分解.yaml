  - kind: fill_in_blank
    q: 提取公因式（要求提干净）：$12a^3b^2 - 8a^2b^3 =$ ______
    answer:
      - 4a^2b^2(3a - 2b)
      - 4a^2b^2(3a-2b)
      - 4a²b²(3a−2b)
      - 4a²b²(3a-2b)
    explanation: 系数 12 与 8 的最大公因数是 4；字母部分 a、b 都共有，次数取较低次，所以取 a² 和 b²。公因式为 4a²b²。用 4a²b² 分别除原式两项：12a³b² ÷ 4a²b² = 3a，8a²b³ ÷
      4a²b² = 2b，所以结果是 4a²b²(3a − 2b)。乘回去可以验证：4a²b²(3a − 2b) = 12a³b² − 8a²b³。
    difficulty: 2
    section: s1
    uses:
      - 最大公因数
      - 同底数幂
      - 分配律
    id: q2
