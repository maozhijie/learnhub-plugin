  - kind: single_choice
    q: 对 $12x^3y^2-18x^2y^3+6x^2y^2$ 提取最大公因式，正确结果是（　）。
    options:
      - $6x^2y^2(2x-3y+1)$
      - $6xy(2x^2y-3xy^2+xy)$
      - $6x^2y^2(2x-3y)$
      - $6x^2y^2(2x^2y-3xy^2+1)$
    answer: A
    explanation: 系数的最大公因数是 $\gcd(12,18,6)=6$，$x$、$y$ 的最低次数分别为 $2$、$2$，所以应提取 $6x^2y^2$。括号内依次为 $2x$、$-3y$、$1$，其中最后的 $+1$ 来自
      $6x^2y^2\div6x^2y^2=1$，不能漏写。B 只提取了 $6xy$，括号内仍有公因式 $xy$，不是最大公因式；C 漏写 $+1$，展开后缺少 $6x^2y^2$ 项；D 括号内指数写错，展开后与原式不符。
    difficulty: 2
    section: s3
    uses:
      - 最大公因数
      - 最低次数
      - 分配律
    id: q6
