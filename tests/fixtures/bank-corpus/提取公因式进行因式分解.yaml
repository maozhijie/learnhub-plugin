  - kind: matching
    q: 把左边的多项式与它的最大公因式配对。
    options:
      - $3x^2+6xy$
      - $4a^3b-8a^2b^2$
      - $6x^2y+9xy^2$
      - $12x^3y^2-18x^2y^3+6x^2y^2$
