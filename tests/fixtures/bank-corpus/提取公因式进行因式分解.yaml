  - kind: true_false
    q: 判断：$-3x^2+6x$ 提取公因式 $-3x$ 后应写成 $-3x(x+2)$。
    answer: 错
    explanation: 若写成 $-3x(x+2)$，展开是 $-3x^2-6x$，第二项符号与原式 $+6x$ 相反。正确结果是 $-3x(x-2)$，因为 $-3x\cdot
      x=-3x^2$，$-3x\cdot(-2)=6x$。提取带负号的公因式时，括号内每一项都要变号。
    difficulty: 2
    section: 概念：首项为负与整体提取公因式的处理
