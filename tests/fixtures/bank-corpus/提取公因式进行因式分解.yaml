    q: 判断：$12x^3y^2-18x^2y^3+6x^2y^2=3x^2y^2(4x-6y+2)$，所以这个多项式已分解完毕。
    answer: 错
    explanation: 等式虽然成立，但提取的不是最大公因式：系数 $12,18,6$ 的最大公因数是 $6$，不是 $3$，括号内各项仍含公因数 $2$。应继续提为 $6x^2y^2(2x-3y+1)$，因此不能说“分解完毕”。
    difficulty: 2
