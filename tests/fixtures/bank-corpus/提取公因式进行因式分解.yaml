  - kind: fill_in_blank
    q: 将 $-8a^3b^2+12a^2b^3-4a^2b$ 分解因式（结果按“括号内首项为正”的习惯书写）：________
    answer:
      - -4a^2b(2ab - 3b^2 + 1)
      - -4a^2b(2ab-3b^2+1)
      - -4a^2b(2ab -3b^2 +1)
      - -4a^2b(2ab - 3b^2+1)
      - -4a^2b(2ab-3b^2 + 1)
    explanation: 系数 $8,12,4$ 的最大公因数是 $4$；字母 $a$ 的最低次数是 $2$，$b$ 的最低次数是 $1$。首项为负，因此提取
      $-4a^2b$：$-8a^3b^2\div(-4a^2b)=2ab$，$12a^2b^3\div(-4a^2b)=-3b^2$，$-4a^2b\div(-4a^2b)=1$。结果是
      $-4a^2b(2ab-3b^2+1)$，注意不能漏写最后一项 $1$。
    difficulty: 2
