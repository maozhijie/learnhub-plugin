  - kind: single_choice
    q: 因式分解 $(x-y)^3+4(x-y)^2$，下列结果正确的是（　）
    options:
      - $(x-y)^2[(x-y)+4]$
      - $(x-y)^2(x-y)+4$
      - $(x-y)^2[4-(x-y)]$
      - $(x-y)^2(x+y+4)$
    answer: A
    explanation: 公因式是 $(x-y)^2$（两项中 $(x-y)$ 的最低次幂）。提取后第一项剩 $(x-y)$，第二项剩 $4$，所以结果为 $(x-y)^2[(x-y)+4]$，也可写成 $(x-y)^2(x-y+4)$。B
      变成 $(x-y)^3+4$，不是原式；C 的符号反了；D 中的 $x+y+4$ 不是提取后剩下的部分。
    difficulty: 3
