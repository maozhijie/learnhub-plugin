  - kind: open_question
    q: 本课把乘法分配律反过来用，就把“和的形式”改写成了“乘积的形式”。请结合具体例子（如
      $6x^2y+9xy^2$）说明：①为什么说提取公因式是乘法分配律的逆用；②公因式如何确定；③提取后如何检验；④这种“乘积形式”对简便计算有什么帮助。
    answer: 要点：① 乘法分配律是 $a(b+c)=ab+ac$，反过来 $ab+ac=a(b+c)$ 就是提取公因式；例如 $6x^2y+9xy^2=3xy(2x+3y)$。② 公因式 = 系数最大公因数 × 公共字母最低次幂：$6$
      和 $9$ 的最大公因数是 $3$，$x$、$y$ 都出现且最低各 1 次，故公因式为 $3xy$。③ 提完后用乘法展开，看能否还原为 $6x^2y+9xy^2$，并检查括号内 $2x$ 与 $3y$ 没有公共因式。④
      乘积形式把公共部分集中，如 $3.14\\times57+3.14\\times43=3.14\\times100=314$ 可简便计算；这种结构也为后续约分、解方程提供方便。
    difficulty: 3
    section: 通用
    uses:
      - 乘法分配律
      - 最大公因数
      - 提取公因式
    id: q23
