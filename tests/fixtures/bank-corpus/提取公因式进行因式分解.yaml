  - kind: single_choice
    q: 用提取公因式法分解整式 $6x^2+9x$，要求把最大公因式一次提净，正确的是（ ）
    options:
      - $3x(2x+3)$
      - $3(2x^2+3x)$
      - $x(6x+9)$
      - $3x(2x^2+3)$
    answer: A
    explanation: 先找最大公因式：系数 6、9 的最大公因数为 3；公共字母最低次幂为 x，所以公因式为 $3x$。$6x^2 ÷ 3x = 2x$，$9x ÷ 3x = 3$，故 $6x^2+9x=3x(2x+3)$。B、C
      只是部分提取，括号内仍有公因式；D 展开为 $6x^3+9x$，与原式不符。
    difficulty: 1
    section: 通用
    uses:
      - 乘法分配律
      - 最大公因数
    id: q9
