  - kind: single_choice
    q: 多项式 6x^3 y + 4x^2 y^2 - 2x^2 y 的公因式是（ ）
    options:
      - 2x^2 y
      - 2xy
      - x^2 y
      - 2x^2 y^2
    answer: A
    explanation: 找公因式时，系数 6、4、2 的最大公因数是 2；字母 x 的最低次幂是 x^2，字母 y 的最低次幂是 y，所以公因式是 2x^2 y。选 2xy 错在字母 x 的幂没有取最低的公共幂；选 x^2 y
      漏掉了系数公因数 2；选 2x^2 y^2 错在 y 的指数 2 并不被第一项中的 y^1 包含。
    difficulty: 1
