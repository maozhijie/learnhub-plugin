  - kind: multi_choice
    q: 下列变形中，属于正确因式分解的有（ ）
    options:
      - $2x(a+b)-3y(a+b)=(a+b)(2x-3y)$
      - $-3x^2+6x=-3x(x-2)$
      - $(x-y)^3+4(x-y)^2=(x-y)^2(x-y+4)$
      - $-2a(x+1)+6b(x+1)=2(x+1)(a-3b)$
    answer:
      - A
      - B
      - C
    explanation: A 把重复出现的 $a+b$ 看作整体，提出后剩 $2x$ 与 $-3y$，正确。B 首项为负，提 $-3x$ 后各项符号正确：$-3x(x-2)=-3x^2+6x$，正确。C 提出最低次幂
      $(x-y)^2$，余下 $(x-y)+4$ 即 $x-y+4$，正确。D 是符号陷阱：原式提出 $(x+1)$ 后括号内为 $-2a+6b$，可写成 $-2(x+1)(a-3b)$ 或 $2(x+1)(3b-a)$，不是
      $2(x+1)(a-3b)$。
    difficulty: 3
    section: 通用
    uses:
      - 整体提取公因式
      - 符号处理
    id: q11
