  - kind: true_false
    q: 分解 $4ab+6ac$ 时，最大公因式可以取 $2abc$。
    answer: 错
    explanation: 字母必须同时出现在每一个项才算公因式。$4ab+6ac$ 中 $b$ 只出现在第一项，$c$ 只出现在第二项，不是各项共有的字母；系数最大公因数为 $2$，所以最大公因式是 $2a$，不是 $2abc$。
    difficulty: 1
