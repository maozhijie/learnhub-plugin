  - kind: single_choice
    q: 按“括号内首项保持为正”的规范，因式分解 $-3x^2+6x$，正确结果是：
    options:
      - $-3x(x-2)$
      - $-3x(x+2)$
      - $3x(-x+2)$
      - $3x(x-2)$
    answer: A
    explanation: 先提负号：$-3x^2+6x=-(3x^2-6x)$，再提 $3x$ 得 $-3x(x-2)$。检验：$-3x(x-2)=-3x^2+6x$。选项 C 虽也等于原式，但括号内首项为负，不符合本节规范；选项 B、D
      展开后与原式不一致。
    difficulty: 1
