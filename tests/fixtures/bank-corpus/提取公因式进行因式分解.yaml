  - kind: multi_choice
    q: 对多项式 $4a^3b-8a^2b^2+2ab$，下列说法正确的有（　）
    options:
      - 三项系数的最大公因数是 $2$。
      - 各项的公因式是 $2ab$。
      - 提取公因式后括号内为 $2a^2-4ab$。
      - 分解结果是 $2ab(2a^2-4ab+1)$。
    answer:
      - A
      - B
      - D
    explanation: 系数 $4,8,2$ 的最大公因数是 $2$；$a$ 的最低次数是 $1$，$b$ 的最低次数是 $1$，所以公因式是
      $2ab$。逐项相除：$4a^3b\div2ab=2a^2$，$-8a^2b^2\div2ab=-4ab$，$2ab\div2ab=1$。C 漏掉了最后一项的 $1$，展开回去会少原来的 $2ab$。
    difficulty: 1
    section: 概念：公因式与提取公因式法
    uses:
