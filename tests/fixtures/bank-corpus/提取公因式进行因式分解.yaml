  - kind: single_choice
    q: 用提取公因式法分解 $3x^2+6xy$，结果正确的是（　）
    options:
      - $3x^2+6xy=3x(x+2y)$
      - $3x^2+6xy=x(3x+6y)$
      - $3x^2+6xy=3(x^2+2xy)$
      - $3x^2+6xy=3x\cdot x+3x\cdot 2y$
    answer: A
    explanation: 系数 $3,6$ 的最大公因数是 $3$，字母部分公共的是 $x$，所以公因式是 $3x$：$3x^2+6xy=3x(x+2y)$。B 提出 $x$ 后括号内仍有公因数 $3$；C 提出 $3$ 后括号内仍有公因式
      $x$；D 只是把两项改写成了含有公因式的和，没有化为乘积形式。
    difficulty: 1
    section: 概念：公因式与提取公因式法
    uses:
