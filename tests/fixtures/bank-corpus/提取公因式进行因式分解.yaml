    explanation: A 乘开确实得 \(12x^2y+6xy^2\)，这是最基本的检验；但 B 错，因为括号内 \(6x+3y\) 还有公因数 3，可继续化为 \(3(2x+y)\)，故第一个结果并没有提干净。同理，第二个括号内
      \(4x+2y\) 还有公因数 2，也不彻底。最彻底的公因式是 \(6xy\)，最终应为 \(6xy(2x+y)\)，所以选 A、C、D。
