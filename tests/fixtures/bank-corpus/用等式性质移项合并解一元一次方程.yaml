node: 用等式性质移项合并解一元一次方程
questions:
  - kind: single_choice
    q: 利用等式性质解方程 3x+2=11 时，第二步需要两边同时除以 3，把 3x 化为 x。这一步能成立的关键条件是（ ）
    options:
      - 3 是非零数
      - 3 是正数
      - 3 是整数
      - x 不能为 0
    answer: A
    explanation: 依据等式性质二：等式两边可以同时乘或除以同一个非零数，因此除以 3 的前提是 3 ≠ 0。除以的数是 3，不是 x，所以与 x 是否为 0 无关；“是正数”“是整数”也不是等式性质的要求，负数、分数同样可以做除数。故选 A。
    difficulty: 1
    section: s1
    uses:
      - 等式
      - 方程的解
    id: q1
  - kind: single_choice
    q: 按“天平精神”解方程 3x + 5 = 20 时，第一步应该怎样操作？
    options:
      - 两边同时减去 5
      - 两边同时除以 3
      - 两边同时加上 5
      - 两边同时乘以 3
    answer: A
    explanation: 把 3x + 5 = 20 看作天平：左盘“3x + 5”，右盘“20”。要孤立出 3x，应先两边同时减去 5，得到 3x = 15；下一步再两边同时除以 3，得到 x =
      5。这就是正文强调的：先处理外加的加减项，再处理相乘的系数。其他选项虽然也可能保持等式成立，但都不是最直接、标准的第一步。
    difficulty: 1
    section: s2
    uses:
      - 等式的天平模型
      - 一元一次方程的求解步骤
    id: q2
  - kind: true_false
    q: 若 $a=b$，则等式两边同时除以 $c$，一定有 $\dfrac{a}{c}=\dfrac{b}{c}$。
    answer: 错
    explanation: 题中没有说明 $c \neq 0$。等式性质二要求两边同时除以同一个非零数；当 $c=0$ 时，$\dfrac{a}{c}$ 与 $\dfrac{b}{c}$ 都没有意义，因此不能说“一定有”。
    difficulty: 1
    section: 通用
    uses:
      - 性质二
    id: q3
  - kind: numeric
    q: 解方程 $6x - 4 = 2x + 8$，$x = $ ____。
    answer: 3
    tol: 0.01
    explanation: 移项要变号：把右边的 $2x$ 移到左边变成 $-2x$，把左边的 $-4$ 移到右边变成 $+4$，得 $6x - 2x = 8 + 4$，即 $4x = 12$。两边同除以 $4$，得 $x =
      3$。回代检验：左边 $6\times 3 - 4 = 14$，右边 $2\times 3 + 8 = 14$，左右相等，解正确。
    difficulty: 2
    section: 通用
    uses:
      - 合并同类项并化简整式
      - 等式性质
    id: q4
