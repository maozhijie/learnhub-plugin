  - kind: single_choice
    q: 用“除以 2、倒序读余数”的方法把十进制数 13 转换成二进制，正确结果是？
    options:
      - "1011"
      - "1101"
      - "1110"
      - "1010"
    answer: B
    explanation: |
      13 ÷ 2 = 6 余 1
      6 ÷ 2 = 3 余 0
      3 ÷ 2 = 1 余 1
      1 ÷ 2 = 0 余 1
      把余数从下往上倒序读出：1101。因此 13 的二进制表示是 1101。
    difficulty: 1
    section: s2
    uses:
      - 除2取余
      - 倒序读余数
