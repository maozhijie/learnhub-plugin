  - kind: multi_choice
    q: 下列关于位、字节和二进制整数的说法，正确的有？
    options:
      - 一个字节由 8 个比特组成，能表示 $2^8=256$ 种不同的状态。
      - 8 个比特能表示 0 到 255 之间的每个整数，但不能表示 256。
      - 比特是二进制位的最小单位，其取值只有 0 和 1。
      - 网络速率中的 1 Mbps 与文件大小中的 1 MB 是同一个单位。
    answer:
      - A
      - B
      - C
    explanation: 1 字节 = 8 位，8 位共有 $2^8=256$ 种状态，正好对应非负整数 0 到 255，因此不能表示 256。比特只有 0、1 两种取值，是信息的最小单位。D 错：Mbps 中的 b 是
      bit（比特），MB 中的 B 是 byte（字节），两者相差 8 倍，不是同一个单位。
    difficulty: 2
    section: 概念：位、字节与计算机中的整数存储
    uses:
      - 比特
      - 字节
      - 二进制位数范围
