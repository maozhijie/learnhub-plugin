  - kind: multi_choice
    q: 关于二进制数 $1101_2$，下列说法正确的有哪些？
    options:
      - 按位权展开为 $1\times2^3+1\times2^2+0\times2^1+1\times2^0$
      - 如果把它当作十进制数，它表示一千一百零一
      - 它的二进制表示是合法的，因为每一位只出现了 0 和 1
      - 它对应的十进制数值是 13
    answer:
      - A
      - C
      - D
    explanation: $1101_2$ 的下标 2
      表示这是二进制数，不能按十进制读作“一千一百零一”。按位权展开：$1\times2^3+1\times2^2+0\times2^1+1\times2^0=8+4+0+1=13$。二进制中每一位只能是 0 或 1，所以选项 C
      正确；选项 B 把二进制误当成了十进制数。
    difficulty: 1
    section: 通用
    uses:
      - 位权
      - 二进制
    id: q4
