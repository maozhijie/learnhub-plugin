  - kind: numeric
    q: 将二进制数 10110₂ 按位权展开并转换成十进制，结果是多少？
    answer: 22
    tol: 0.01
    explanation: 10110₂ = 1×16 + 0×8 + 1×4 + 1×2 + 0×1 = 16 + 4 + 2 = 22。
