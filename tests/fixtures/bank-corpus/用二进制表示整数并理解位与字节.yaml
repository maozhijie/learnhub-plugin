  - kind: numeric
    q: 一个字节的二进制数 $10110110_2$ 对应的十进制数值是多少？
    answer: 182
    tol: 0.01
    explanation: 按位权展开：$1\times128+0\times64+1\times32+1\times16+0\times8+1\times4+1\times2+0\times1=128+32+16+4+2=182$。
    difficulty: 2
