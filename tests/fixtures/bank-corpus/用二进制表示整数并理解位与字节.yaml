  - kind: fill_in_blank
    q: 用“不断除以 2、倒着读余数”的方法，把十进制 43 转换成二进制，结果是 ______。（只填写二进制数字本身）
    answer:
      - "101011"
      - 101011₂
      - 101011_2
    explanation: 43 连续除以 2，得到余数依次为 1、1、0、1、0、1；余数倒序为 1、0、1、0、1、1，所以是
      $101011_2$。验证：$1\times32+0\times16+1\times8+0\times4+1\times2+1\times1=43$。
    difficulty: 2
    section: 通用
    uses:
