  - kind: ordering
    q: 把下列“除 2 取余”的步骤按正确执行顺序排列。
    options:
      - 若商不为 0，则继续除以 2
      - 记录当前数除以 2 的余数
      - 把当前数更新为刚才得到的商
      - 除到商为 0 后，把余数从下往上读出
    answer:
      - 记录当前数除以 2 的余数
      - 把当前数更新为刚才得到的商
      - 若商不为 0，则继续除以 2
      - 除到商为 0 后，把余数从下往上读出
    explanation: 转换时先记录余数，再用商替换当前数；只要商不为 0 就继续除；商为 0 时停止，并把记下的余数从下往上倒序读出，例如 13 转为二进制得到 1101。
    difficulty: 2
    section: 演示：将十进制整数转换为二进制
