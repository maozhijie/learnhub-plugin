  - kind: single_choice
    q: 二进制数 1101₂ 中，最左边（最高位）的 1 所对应的数值是多少？
    options:
      - "1"
      - "2"
      - "4"
      - "8"
    answer: D
    explanation: 从右往左看，各位位权依次是 2⁰=1、2¹=2、2²=4、2³=8。最左边的 1 位于 2³ 位，因此它表示 8，而不是直接当作十进制中的“1”。
    difficulty: 1
    section: 概念：十进制与二进制的位权表示
