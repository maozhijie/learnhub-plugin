  - kind: multi_choice
    q: 关于比特和字节，下列说法正确的有（　）。
    options:
      - 一个字节由 8 个比特组成
      - 一个字节能表示 256 种不同的状态
      - 一个字节能容纳 0 到 255 的整数
      - 位（bit）和字节（byte）是同一个概念，只是叫法不同
    answer:
      - A
      - B
      - C
    explanation: A 正确，字节的定义就是 8 个比特；B 正确，8 个比特有 2⁸ = 256 种组合；C 正确，若表示非负整数，正好对应 0 到 255；D 错误，bit 是二进制位，byte 由 8 个 bit 组成，二者不是同一概念。
    difficulty: 1
    section: 概念：位、字节与计算机中的整数存储
