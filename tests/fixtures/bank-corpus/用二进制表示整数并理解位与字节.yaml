node: 用二进制表示整数并理解位与字节
questions:
  - kind: single_choice
    q: 关于十进制与二进制的位权表示，下列说法正确的是（　）
    options:
      - 十进制与二进制都遵循“位权相加”的原理，只是位权的底数不同
      - 二进制数 1101₂ 的值等于 1 + 1 + 0 + 1 = 3
      - 二进制中允许出现数字 2，因为二进制也是逢十进一
      - 4 个比特一共可以表示 2 × 4 = 8 种不同状态
    answer: A
    explanation: 位权原理指每一位的数字乘以该位对应的基数幂再求和。十进制位权是 10 的幂，二进制位权是 2 的幂，因此 A 正确。1101₂ 应按位权展开为 1×2³ + 1×2² + 0×2¹ + 1×2⁰ = 8+4+0+1
      = 13，不是 3。二进制只有数字 0 和 1，逢二进一，没有数字 2。n 个比特能表示 2ⁿ 种状态，4 个比特应表示 2⁴ = 16 种状态。
    difficulty: 1
    section: s1
    uses:
      - 位权
      - 二进制
      - 十进制
      - 比特
    id: q1
