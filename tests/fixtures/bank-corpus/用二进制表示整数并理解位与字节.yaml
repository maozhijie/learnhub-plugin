  - kind: fill_in_blank
    q: 用“除以 2、倒序读余数”的方法，将十进制数 26 转换为二进制，结果是（只填二进制数字串，不写下标）：____₂
    answer:
      - "11010"
    explanation: 26÷2=13 余 0，13÷2=6 余 1，6÷2=3 余 0，3÷2=1 余 1，1÷2=0 余 1；从下往上读余数得 11010。验证：16+8+2=26。
    difficulty: 2
