  - kind: fill_in_blank
    q: 把十进制数 $27$ 转换为二进制，结果是 ____（填二进制字符串）。
    answer:
      - "11011"
      - 11011₂
      - (11011)_2
    explanation: 用“除以 2、倒序读余数”：$27\div2=13$ 余 1，$13\div2=6$ 余 1，$6\div2=3$ 余 0，$3\div2=1$ 余 1，$1\div2=0$ 余 1；倒序读出为
      $11011_2$。也可验证 $16+8+2+1=27$。
    difficulty: 2
    section: 演示：将十进制整数转换为二进制
