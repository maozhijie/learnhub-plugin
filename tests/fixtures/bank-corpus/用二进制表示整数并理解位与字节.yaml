  - kind: single_choice
    q: 在计算机中，1 字节（byte）由多少个二进制位（bit）组成？
    options:
      - 1 个
      - 2 个
      - 8 个
      - 16 个
    answer: C
    explanation: 字节是计算机硬件中常见的组合单位，1 字节固定由 8 个二进制位组成。1 个二进制位只能表示 0 或 1 两种状态，而 8 个位组合起来共有 \(2^8=256\) 种模式，因此一个字节可以表示 0 到 255
      的整数或一个英文字母的编码。
    difficulty: 1
    section: s3
    uses:
      - 位
      - 字节
    id: q3
