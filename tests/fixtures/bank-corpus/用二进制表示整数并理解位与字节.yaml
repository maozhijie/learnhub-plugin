  - kind: open_question
    q: 结合位权、二进制与比特/字节的知识解释：为什么计算机中的整数类型存在表示范围？为什么 8 个比特恰好能表示 0 到 255 的整数，而不是“0 到 256”？
    answer: |-
      参考要点：
      1. 计算机用比特的两种物理状态表示 0 和 1，整数最终按二进制位权展开；
      2. 存储整数的比特位数是有限的，因此只能产生有限的组合模式；
      3. n 个比特共有 2ⁿ 种模式；若只表示非负整数，可表示的范围是 0 到 2ⁿ−1；
      4. 1 字节 = 8 个比特，所以共有 2⁸ = 256 种状态，对应十进制整数 0, 1, 2, …, 255 共 256 个；0 到 256 实际上是 257 个数，因此超出 1 字节的表示范围。
    difficulty: 2
    section: 通用
    uses:
      - 位权
      - 比特
      - 字节
      - 整数范围
    id: q11
    fsrs:
      reps: 1
      lapses: 0
      stability: 2.31
      difficulty: 2.12
      due: 2026-09-12
      last_review: 2026-09-09
  - kind: single_choice
    q: 按位权展开时，二进制数 $1101_2$ 各位的位权从左到右依次是什么？
    options:
      - 8、4、2、1
      - 1、2、4、8
      - 16、8、4、2
      - 2、4、8、16
    answer: A
    explanation: 从右往左看，位权依次是 $2^0=1$、$2^1=2$、$2^2=4$、$2^3=8$，所以从左到右是 8、4、2、1。选项 B 是反序；选项 C 把最高位位权错当成 16；选项 D 既反序又错位。
    difficulty: 1
    section: 概念：十进制与二进制的位权表示
    uses:
